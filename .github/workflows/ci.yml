name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      # On pull_request this checks out the merge commit of the PR into main.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

      - name: Lint Helm chart
        run: helm lint charts/app -f charts/app/values-ci.yaml

      - name: Render Helm chart
        run: helm template app charts/app -f charts/app/values-ci.yaml > /dev/null

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Validates every rendered manifest against the Kubernetes API schema.
      - name: Validate manifests with kubeconform
        run: |
          set -o pipefail
          helm template app charts/app -f charts/app/values-ci.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.31.0

  docker:
    name: "Docker: build image and check it starts"
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gke-flyway-cicd:ci .

      # Starting uvicorn imports the app and psycopg, which catches musl/wheel problems
      # a plain build would miss. /healthz does not need the database.
      - name: Start container and check /healthz
        run: |
          docker run -d --name app -p 8000:8000 gke-flyway-cicd:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  k8s:
    name: "K8s: deploy chart and check Service and DB"
    runs-on: ubuntu-latest
    needs: docker
    # Skipped until the GCP repo variables exist, and on fork PRs, which cannot get an OIDC token.
    if: ${{ vars.CLOUDSQL_INSTANCE != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gke-flyway-cicd:ci .

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      # The tunnel to Cloud SQL. It listens on all interfaces so pods in kind can reach it.
      # --auto-iam-authn makes the proxy log in as the service account (IAM database
      # authentication), so there is no database password.
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --auto-iam-authn --address 0.0.0.0 --port 5432 "${{ vars.CLOUDSQL_INSTANCE }}" > proxy.log 2>&1 &
          for i in $(seq 1 15); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/5432'; then exit 0; fi
            sleep 1
          done
          cat proxy.log
          exit 1

      - name: Create local Kubernetes cluster (kind) and load image
        run: |
          kind create cluster --wait 120s
          kind load docker-image gke-flyway-cicd:ci

      # --wait only returns once the pod is Ready, and /readyz needs the database,
      # so this step also proves the pod can reach Cloud SQL.
      - name: Deploy chart
        run: |
          gateway=$(docker network inspect kind -f '{{(index .IPAM.Config 0).Gateway}}')
          helm upgrade --install app charts/app -f charts/app/values-ci.yaml \
            --set-string db.host="$gateway" \
            --wait --timeout 3m

      - name: Check pods are healthy
        run: |
          kubectl rollout status deploy/app --timeout=60s
          kubectl get pods -l app.kubernetes.io/instance=app
          restarts=$(kubectl get pods -l app.kubernetes.io/instance=app \
            -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}')
          echo "restart counts: $restarts"
          for r in $restarts; do test "$r" = "0"; done

      # A Service IP is virtual and does not answer ICMP ping (and the pod has no NET_RAW),
      # so resolve the Service DNS name and open a TCP connection to its port instead.
      # The probes already cover /healthz.
      - name: Check Service DNS and port from inside the pod
        run: |
          kubectl exec deploy/app -- python -c "import socket; host = 'app.default.svc.cluster.local'; ip = socket.gethostbyname(host); print(host, 'resolves to', ip); socket.create_connection((host, 80), timeout=5).close(); print('port 80 accepts connections')"

      - name: Check DB connection from inside the pod
        run: |
          kubectl exec deploy/app -- python -c "from app import db; print(db.db_version())"

      - name: Dump diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl logs deploy/app --tail=100 || true
          cat proxy.log || true
