name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      # On pull_request this checks out the merge commit of the PR into main.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

      - name: Lint Helm chart
        run: helm lint charts/app -f charts/app/values-ci.yaml

      - name: Render Helm chart
        run: helm template app charts/app -f charts/app/values-ci.yaml > /dev/null

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Validates every rendered manifest against the Kubernetes API schema.
      - name: Validate manifests with kubeconform
        run: |
          set -o pipefail
          helm template app charts/app -f charts/app/values-ci.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.31.0

  docker:
    name: Build and start image
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gke-flyway-cicd:ci .

      # Starting uvicorn imports the app and psycopg, which catches musl/wheel problems
      # a plain build would miss. /healthz does not need the database.
      - name: Start container and check /healthz
        run: |
          docker run -d --name app -p 8000:8000 gke-flyway-cicd:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
