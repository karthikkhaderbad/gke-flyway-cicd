# Overrides for the kind cluster in CI. The image is built on the runner and loaded
# into kind, so it must never be pulled.
image:
  repository: gke-flyway-cicd
  tag: ci
  pullPolicy: Never

# CI connects to Cloud SQL through the Auth Proxy on the runner as a read-only user.
# db.host (the runner's address on the kind network) and db.password (from Secret
# Manager) are set with --set at deploy time. The host below only satisfies the
# chart's `required` check when linting and rendering.
db:
  host: set-at-deploy
  name: app
  user: ci_ro
